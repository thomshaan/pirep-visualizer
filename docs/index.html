<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abel Jets PIREP Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --plum-dk:#3E1530;--plum:#5A1F3D;--wine:#7A1F4A;
  --magenta:#B8195A;--pink:#E63862;--coral:#F55D5D;--salmon:#ED7B5E;
  --orange:#F99420;--gold:#F5C624;
  --bg:#1A0A15;--bg2:#2A0F22;
  --surf:rgba(58,20,44,0.82);--surf2:rgba(90,31,61,0.55);
  --border:rgba(249,148,32,0.18);--border-hi:rgba(249,148,32,0.45);
  --text:#F5E6DA;--dim:rgba(245,230,218,0.45);
  --fd:'Unbounded',sans-serif;--fb:'Plus Jakarta Sans',sans-serif;--fm:'JetBrains Mono',monospace;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--fb);}
body::after{content:'';position:fixed;inset:0;z-index:9;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.035) 3px,rgba(0,0,0,0.035) 4px);}

/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
  justify-content:space-between;padding:18px 28px;
  background:linear-gradient(180deg,rgba(26,10,21,.98) 0%,transparent 100%);pointer-events:none;}
.hdr-brand{display:flex;align-items:center;gap:14px;}
.hdr-logo{width:54px;height:54px;display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 18px rgba(249,148,32,.5));}
.hdr-logo img{width:100%;height:100%;object-fit:contain;}
.hdr-title{font-family:var(--fd);font-size:14px;font-weight:700;letter-spacing:.18em;
  color:var(--gold);text-transform:uppercase;}
.hdr-sub{font-size:10px;letter-spacing:.18em;color:var(--dim);margin-top:3px;text-transform:uppercase;font-weight:500;}
.hdr-stats{display:flex;gap:32px;}
.stat{text-align:right;}
.stat-val{font-family:var(--fd);font-size:19px;color:var(--orange);font-weight:700;line-height:1;letter-spacing:.04em;}
.stat-lbl{font-size:9px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-top:3px;font-weight:600;}

/* ZULU CLOCK */
.zulu-clock{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:18;pointer-events:none;
  font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.18em;
  color:var(--gold);text-shadow:0 0 14px rgba(245,198,36,.5);
  padding:8px 18px;border:1px solid rgba(245,198,36,.3);border-radius:20px;
  background:rgba(62,21,48,.4);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:10px;white-space:nowrap;}
.zc-dot{width:6px;height:6px;border-radius:50%;background:var(--orange);
  box-shadow:0 0 6px var(--orange);animation:blink 1s step-end infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* RIGHT PANEL */
.rpanel{position:fixed;top:90px;right:0;bottom:0;width:320px;z-index:20;
  display:flex;flex-direction:column;pointer-events:auto;
  background:linear-gradient(180deg,rgba(18,7,16,.96) 0%,rgba(26,10,21,.92) 100%);
  border-left:1px solid rgba(249,148,32,.1);backdrop-filter:blur(28px);
  transition:transform .3s cubic-bezier(.23,1,.32,1);}
body.panel-collapsed .rpanel{transform:translateX(100%);}

/* Panel toggle tab */
#panelToggle{position:fixed;top:50%;right:319px;transform:translateY(-50%);z-index:25;
  width:22px;height:56px;background:rgba(18,7,16,.96);border:1px solid rgba(249,148,32,.25);
  border-right:none;border-radius:6px 0 0 6px;color:var(--orange);cursor:pointer;
  font-size:11px;display:flex;align-items:center;justify-content:center;pointer-events:auto;
  transition:right .3s cubic-bezier(.23,1,.32,1),background .18s;}
#panelToggle:hover{background:rgba(62,21,48,.9);border-color:rgba(249,148,32,.5);}
body.panel-collapsed #panelToggle{right:0;}

/* Pilot filter header */
.rf-head{padding:10px 14px 10px;flex-shrink:0;border-bottom:1px solid rgba(249,148,32,.08);}
.slbl{font-family:var(--fd);font-size:9px;letter-spacing:.3em;color:var(--gold);opacity:.7;
  text-transform:uppercase;padding:0 4px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.slbl-count{font-size:9px;letter-spacing:.08em;color:var(--orange);opacity:1;
  background:rgba(249,148,32,.1);border:1px solid rgba(249,148,32,.25);
  border-radius:10px;padding:1px 7px;font-family:var(--fm);}
.pf-input-wrap{position:relative;margin-bottom:8px;}
.pf-input{width:100%;background:rgba(42,15,34,.8);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px 8px 32px;color:var(--text);font-family:var(--fb);
  font-size:11px;outline:none;transition:border-color .2s;}
.pf-input::placeholder{color:var(--dim);}
.pf-input:focus{border-color:var(--border-hi);}
.pf-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  font-size:12px;color:var(--dim);pointer-events:none;}
.pilot-chips{display:flex;flex-direction:row;flex-wrap:wrap;gap:4px;max-height:56px;overflow-y:auto;padding-bottom:2px;}
.pilot-chips::-webkit-scrollbar{width:2px;}
.pilot-chips::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.pchip{padding:3px 8px;border-radius:4px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-family:var(--fm);font-size:9px;
  cursor:pointer;transition:all .18s;letter-spacing:.06em;white-space:nowrap;}
.pchip.active{background:rgba(249,148,32,.12);border-color:var(--orange);color:var(--orange);}
.pchip:hover:not(.active){border-color:var(--border-hi);color:var(--text);}

/* Stats bar */
#statsBar{padding:5px 14px;font-family:var(--fm);font-size:8px;letter-spacing:.1em;
  color:rgba(245,230,218,.35);border-bottom:1px solid rgba(249,148,32,.06);flex-shrink:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#statsBar span{color:var(--orange);}

/* Flight list */
.flight-list{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-height:0;transition:opacity .15s;}
.flight-list.fading{opacity:0;}
.flight-list::-webkit-scrollbar{width:3px;}
.flight-list::-webkit-scrollbar-thumb{background:rgba(249,148,32,.2);border-radius:2px;}
.no-flights{text-align:center;padding:32px 16px;color:var(--dim);font-size:11px;letter-spacing:.1em;}

/* FLIGHT CARDS — compact */
.pcard{background:rgba(42,15,34,.55);border:1px solid var(--border);border-radius:8px;
  padding:9px 12px 9px 15px;cursor:pointer;
  transition:all .22s cubic-bezier(.23,1,.32,1);
  position:relative;overflow:hidden;}
.pcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--cc,var(--orange));box-shadow:0 0 6px var(--cc,var(--orange));}
.pcard:hover,.pcard.active{border-color:rgba(249,148,32,.35);
  background:rgba(62,21,48,.7);transform:translateX(-3px);
  box-shadow:0 4px 20px rgba(0,0,0,.4);}
.card-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.cf{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--cc,var(--gold));
  text-shadow:0 0 8px var(--cc,var(--orange));letter-spacing:.04em;}
.csub{font-family:var(--fm);font-size:8px;letter-spacing:.1em;color:var(--dim);margin-top:1px;}
.ctime{font-family:var(--fm);font-size:9px;color:var(--dim);letter-spacing:.06em;}
.croute{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;margin-bottom:3px;color:var(--text);}
.carrow{color:var(--dim);font-size:8px;}
.cinfo{font-family:var(--fm);font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Pagination */
.pag{display:flex;align-items:center;justify-content:space-between;
  padding:6px 12px;flex-shrink:0;border-top:1px solid rgba(249,148,32,.07);}
.pag-btn{background:transparent;border:1px solid rgba(249,148,32,.28);color:rgba(249,148,32,.7);
  font-family:var(--fm);font-size:9px;letter-spacing:.1em;padding:4px 10px;
  border-radius:4px;cursor:pointer;transition:all .18s;}
.pag-btn:disabled{opacity:.2;cursor:default;}
.pag-btn:not(:disabled):hover{background:rgba(249,148,32,.12);color:var(--orange);border-color:var(--orange);}
.pag-info{font-family:var(--fm);font-size:9px;color:var(--dim);letter-spacing:.1em;}

/* Panel footer */
.panel-footer{padding:7px 14px;border-top:1px solid rgba(249,148,32,.07);flex-shrink:0;
  display:flex;justify-content:space-between;align-items:center;}
.pf-status{font-family:var(--fm);font-size:8px;letter-spacing:.1em;color:rgba(245,230,218,.22);}
.pf-dot{width:5px;height:5px;border-radius:50%;background:var(--orange);
  box-shadow:0 0 5px var(--orange);animation:blink 2s step-end infinite;flex-shrink:0;}

/* DETAIL VIEW (inside right panel) */
.detail-view{flex:1;overflow-y:auto;padding:0 10px 10px;display:none;flex-direction:column;gap:0;}
.detail-view::-webkit-scrollbar{width:3px;}
.detail-view::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.detail-view.vis{display:flex;}
.dv-back{display:flex;align-items:center;gap:7px;padding:0 6px 10px;
  color:var(--dim);font-size:10px;letter-spacing:.12em;cursor:pointer;
  transition:color .2s;font-family:var(--fm);border:none;background:none;text-transform:uppercase;}
.dv-back:hover{color:var(--orange);}
.dv-card{background:rgba(26,10,21,.9);border:1px solid var(--border);border-radius:12px;
  backdrop-filter:blur(24px);padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.dh{display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.dfn{font-family:var(--fd);font-size:24px;font-weight:900;color:var(--dc,var(--orange));
  text-shadow:0 0 18px var(--dc,var(--orange));line-height:1;}
.dpilot{font-size:11px;color:var(--dim);margin-top:5px;letter-spacing:.1em;text-transform:uppercase;}
.dbadge{background:rgba(249,148,32,.08);border:1px solid var(--dc,var(--orange));
  color:var(--dc,var(--orange));font-family:var(--fm);font-size:9px;
  padding:4px 9px;border-radius:4px;letter-spacing:.12em;white-space:nowrap;}
.drte{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;
  padding:12px;background:rgba(249,148,32,.03);border-radius:8px;border:1px solid rgba(249,148,32,.07);}
.dap{text-align:center;}
.dicao{font-family:var(--fd);font-size:16px;font-weight:700;color:var(--text);}
.dtime{font-family:var(--fm);font-size:10px;color:var(--dc,var(--orange));margin-top:3px;}
.dname{font-size:9px;color:var(--dim);margin-top:3px;max-width:90px;line-height:1.3;}
.dline{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 8px;}
.dair{font-family:var(--fm);font-size:10px;color:var(--dim);}
.ddiv{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--dc,var(--orange)),transparent);position:relative;}
.ddiv::after{content:'✈';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:10px;color:var(--dc,var(--orange));background:rgba(26,10,21,.9);padding:0 4px;}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.df{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:6px;padding:8px 10px;}
.dfl{font-size:8px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:3px;}
.dfv{font-family:var(--fm);font-size:11px;color:var(--text);font-weight:700;}
.dmeta{font-family:var(--fm);font-size:8px;color:var(--dim);margin-top:3px;max-width:100px;line-height:1.5;letter-spacing:.03em;}

/* AIRCRAFT IMAGE CARD (in detail view) */
.dac{margin-bottom:14px;border:1px solid var(--border);border-radius:8px;overflow:hidden;
  background:rgba(255,255,255,.02);}
.dac-img{display:block;width:100%;max-height:150px;object-fit:cover;opacity:0;transition:opacity .5s;}
.dac.ok .dac-img{opacity:1;}
.dac-cap{display:flex;flex-wrap:wrap;gap:4px 10px;padding:7px 10px;align-items:baseline;}
.dac-nose{font-family:var(--fd);font-size:9px;color:var(--gold);letter-spacing:.08em;}
.dac-scheme{font-family:var(--fm);font-size:8px;color:var(--dim);letter-spacing:.04em;}
.dac-mod{font-family:var(--fm);font-size:8px;color:rgba(245,230,218,.3);letter-spacing:.04em;margin-left:auto;}

.deval{background:rgba(230,56,98,.06);border:1px solid rgba(230,56,98,.22);border-radius:8px;padding:12px;}
.devlbl{font-size:8px;letter-spacing:.22em;color:rgba(245,198,36,.85);text-transform:uppercase;margin-bottom:6px;font-weight:700;}
.devtxt{font-size:11px;line-height:1.65;color:rgba(245,230,218,.82);font-style:italic;}
.dfpl{background:rgba(249,148,32,.05);border:1px solid rgba(249,148,32,.18);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
.dfpl-lbl{font-size:8px;letter-spacing:.2em;color:rgba(245,198,36,.85);text-transform:uppercase;margin-bottom:5px;font-weight:700;}
.dfpl-txt{font-family:var(--fm);font-size:9px;line-height:1.6;color:rgba(245,230,218,.72);word-break:break-word;letter-spacing:.02em;}


/* BOTTOM-LEFT TOOLBAR */
.blbar{position:fixed;bottom:14px;left:16px;z-index:30;display:flex;gap:6px;pointer-events:auto;}
.blbtn{padding:5px 10px;border:1px solid rgba(249,148,32,.35);border-radius:5px;
  background:rgba(26,10,21,.9);color:rgba(249,148,32,.6);font-family:var(--fm);
  font-size:9px;letter-spacing:.15em;cursor:pointer;transition:all .18s;}
.blbtn:hover{border-color:var(--orange);color:var(--orange);}
.blbtn.on{background:rgba(249,148,32,.15);border-color:var(--orange);color:var(--orange);}

/* DENSITY LEGEND */
#densLegend{position:fixed;bottom:48px;left:16px;z-index:29;display:none;align-items:center;gap:8px;
  background:rgba(26,10,21,.9);border:1px solid var(--border);border-radius:6px;padding:6px 10px;
  font-family:var(--fm);font-size:8px;letter-spacing:.12em;color:var(--dim);pointer-events:none;}
#densLegend.vis{display:flex;}
.dl-bar{width:90px;height:6px;border-radius:3px;background:linear-gradient(90deg,#F5C624,#F99420,#E63862);}

/* OPS REPORT MODAL */
.ops-overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(10,4,9,.72);backdrop-filter:blur(6px);pointer-events:auto;}
.ops-overlay.vis{display:flex;}
.ops-modal{width:min(760px,94vw);max-height:86vh;display:flex;flex-direction:column;
  background:rgba(26,10,21,.97);border:1px solid var(--border-hi);border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden;}
.ops-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
.ops-title{font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.2em;
  color:var(--gold);text-transform:uppercase;}
.ops-tabs{display:flex;gap:5px;}
.ops-tab{padding:5px 12px;border:1px solid var(--border);border-radius:5px;background:transparent;
  color:var(--dim);font-family:var(--fm);font-size:9px;letter-spacing:.12em;cursor:pointer;transition:all .18s;}
.ops-tab.on{background:rgba(249,148,32,.12);border-color:var(--orange);color:var(--orange);}
.ops-close{border:none;background:none;color:var(--dim);font-size:16px;cursor:pointer;line-height:1;}
.ops-close:hover{color:var(--orange);}
.ops-body{padding:16px 18px;overflow-y:auto;}
.ops-body::-webkit-scrollbar{width:3px;}
.ops-body::-webkit-scrollbar-thumb{background:rgba(249,148,32,.2);border-radius:2px;}
.ops-mnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;}
.ops-month{font-family:var(--fd);font-size:14px;color:var(--text);letter-spacing:.14em;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px;}
.kpi{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px 12px;}
.kpi-l{font-size:8px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:5px;}
.kpi-v{font-family:var(--fd);font-size:15px;color:var(--orange);font-weight:700;line-height:1.2;}
.kpi-s{font-family:var(--fm);font-size:9px;color:var(--dim);margin-top:3px;}
.ops-sec{font-size:8px;letter-spacing:.24em;color:var(--gold);opacity:.75;text-transform:uppercase;
  margin:14px 0 8px;font-family:var(--fd);}
.wk-chart{display:flex;gap:10px;align-items:flex-end;height:120px;padding:0 4px;margin-bottom:6px;}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;}
.wk-bar{width:100%;max-width:56px;border-radius:4px 4px 0 0;
  background:linear-gradient(180deg,var(--gold),var(--orange));
  box-shadow:0 0 12px rgba(249,148,32,.25);min-height:2px;}
.wk-n{font-family:var(--fm);font-size:10px;color:var(--gold);}
.wk-lbl{display:flex;gap:10px;padding:0 4px;}
.wk-l{flex:1;text-align:center;font-family:var(--fm);font-size:8px;color:var(--dim);
  letter-spacing:.1em;line-height:1.6;}

/* FLEET TIMELINE — card grid */
.tl-axis{display:flex;justify-content:space-between;font-family:var(--fm);font-size:8px;
  color:var(--dim);letter-spacing:.1em;padding:0 0 10px;}
.tl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.tl-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;display:flex;flex-direction:column;transition:border-color .18s,transform .18s;}
.tl-card:hover{border-color:var(--border-hi);transform:translateY(-2px);}
.tl-img-wrap{position:relative;width:100%;height:130px;background:rgba(255,255,255,.03);overflow:hidden;}
.tl-img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s;}
.tl-img-wrap.ok .tl-img{opacity:1;}
.tl-noimg{width:100%;height:130px;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-family:var(--fm);font-size:9px;letter-spacing:.18em;
  background:linear-gradient(135deg,rgba(90,31,61,.35),rgba(42,15,34,.55));}
.tl-body{padding:11px 13px 12px;display:flex;flex-direction:column;gap:7px;}
.tl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.tl-reg{font-family:var(--fd);font-size:14px;color:var(--text);font-weight:700;letter-spacing:.03em;}
.tl-hours{font-family:var(--fm);font-size:11px;color:var(--orange);text-align:right;white-space:nowrap;}
.tl-hours span{color:var(--dim);font-size:8px;}
.tl-sub{font-family:var(--fm);font-size:8px;color:var(--dim);line-height:1.5;letter-spacing:.03em;}
.tl-nose{color:var(--gold);}
.tl-track{position:relative;height:20px;background:rgba(255,255,255,.03);border-radius:4px;margin-top:1px;}
.tl-dot{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;
  box-shadow:0 0 8px currentColor;transition:transform .15s;}
.tl-dot:hover{transform:translate(-50%,-50%) scale(1.5);}

/* DEBUG */
#dbgPanel{position:fixed;bottom:46px;left:16px;z-index:30;width:340px;
  background:rgba(16,6,14,.96);border:1px solid rgba(249,148,32,.3);border-radius:8px;
  padding:12px 14px;font-family:var(--fm);font-size:10px;color:var(--text);
  display:none;pointer-events:auto;backdrop-filter:blur(14px);}
#dbgPanel.vis{display:block;}
.dbg-row{display:flex;justify-content:space-between;padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.05);}
.dbg-lbl{color:var(--dim);font-size:9px;letter-spacing:.12em;}
.dbg-val{color:var(--gold);text-align:right;max-width:200px;word-break:break-all;line-height:1.4;}
.dbg-ok{color:#4caf7d;} .dbg-err{color:#e63862;}
.dbg-keys{margin-top:8px;color:var(--dim);font-size:9px;line-height:1.7;word-break:break-all;}
.dbg-keys span{display:inline-block;background:rgba(249,148,32,.08);border:1px solid rgba(249,148,32,.2);
  border-radius:3px;padding:1px 5px;margin:2px;color:var(--orange);}

<script>
// ═══════════════════════════════════════════════════════
// AIRPORT COORDINATE LOOKUP (populated from OurAirports CSV)
// ═══════════════════════════════════════════════════════
let AIRPORT_COORDS = {};

// Debug state
let _dbgAirports=0,_dbgPireps=0,_dbgFallback=true,_dbgErr=null,_dbgRawKeys=[],_dbgLastFetch=null;

const AIRPORTS_CSV_URL = 'https://davidmegginson.github.io/ourairports-data/airports.csv';

async function fetchAirportDB() {
  try {
    const res = await fetch(AIRPORTS_CSV_URL);
    const text = await res.text();
    const lines = text.split('\n');
    const header = lines[0].split(',').map(h => h.replace(/"/g,'').trim());
    const idx = {
      ident:      header.indexOf('ident'),
      name:       header.indexOf('name'),
      lat:        header.indexOf('latitude_deg'),
      lon:        header.indexOf('longitude_deg'),
      gps_code:   header.indexOf('gps_code'),
      local_code: header.indexOf('local_code'),
      type:       header.indexOf('type'),
      elev:       header.indexOf('elevation_ft'),
      continent:  header.indexOf('continent'),
      country:    header.indexOf('iso_country'),
      region:     header.indexOf('iso_region'),
      muni:       header.indexOf('municipality'),
    };
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].match(/(".*?"|[^,]+|(?<=,)(?=,)|(?<=,)$)/g);
      if (!cols) continue;
      const clean = c => (c>=0 ? (cols[c] || '') : '').replace(/"/g,'').trim();
      const lat = parseFloat(clean(idx.lat));
      const lon = parseFloat(clean(idx.lon));
      if (isNaN(lat) || isNaN(lon)) continue;
      const entry = { lat, lon, name: clean(idx.name),
        type: clean(idx.type), elev: clean(idx.elev), continent: clean(idx.continent),
        country: clean(idx.country), region: clean(idx.region), muni: clean(idx.muni) };
      const icao  = clean(idx.ident);
      if (icao.length === 4)  AIRPORT_COORDS[icao]  = entry;
      const gps   = clean(idx.gps_code);
      if (gps.length === 4   && !AIRPORT_COORDS[gps])   AIRPORT_COORDS[gps]   = entry;
      const local = clean(idx.local_code);
      if (local.length === 4 && !AIRPORT_COORDS[local]) AIRPORT_COORDS[local] = entry;
    }
    _dbgAirports=Object.keys(AIRPORT_COORDS).length;
    console.info('[AirportDB] Loaded', _dbgAirports, 'airports');
  } catch(err) {
    _dbgAirports=0;
    console.warn('[AirportDB] Failed to load CSV:', err.message);
  }
}

// ═══════════════════════════════════════════════════════
// AIRPORT METADATA HELPERS (from OurAirports columns)
// ═══════════════════════════════════════════════════════
function countryFlag(iso){
  if(!iso||iso.length!==2||!/^[A-Za-z]{2}$/.test(iso)) return '';
  return String.fromCodePoint(...[...iso.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65));
}
const _AP_TYPE_LABEL={large_airport:'Large Airport',medium_airport:'Medium Airport',
  small_airport:'Small Airport',heliport:'Heliport',seaplane_base:'Seaplane Base',
  balloonport:'Balloonport',closed:'Closed'};
function apTypeLabel(t){ return _AP_TYPE_LABEL[t]||''; }
function airportMeta(icao){
  const a=AIRPORT_COORDS[icao];
  if(!a) return '';
  const bits=[];
  const flag=countryFlag(a.country);
  if(a.muni) bits.push((flag?flag+' ':'')+a.muni);
  else if(flag) bits.push(flag+' '+(a.country||''));
  const t=apTypeLabel(a.type); if(t) bits.push(t);
  if(a.elev&&!isNaN(parseFloat(a.elev))) bits.push(parseFloat(a.elev)+' ft');
  return bits.join(' · ');
}

// ═══════════════════════════════════════════════════════
// FLEET DATABASE (aircraft images via public Google Drive)
// ═══════════════════════════════════════════════════════
// Headers live on row 6 of the fleet sheet (rows 1-5 are banners), so opensheet
// can't parse it — use Google's GViz CSV export with an explicit range instead.
const FLEET_URL='https://docs.google.com/spreadsheets/d/1XTljWsk86qbTZq4mfWsfHYojv9Uv5iMoN_ilAkT5WmE/gviz/tq?tqx=out:csv&sheet=ABEL%20JETS%20EXTENDED%20PACK%20%5B8.0%5D%20UPDATES&range=A6:P';
let FLEET_BY_REG={};
let _dbgFleet=0;

// Minimal CSV parser (handles quoted fields, escaped quotes, newlines in cells)
function parseCSV(text){
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(ch!=='\r') cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}

// Extract a Google Drive file id from any share-link form and build a direct thumbnail URL.
function driveThumb(url,size){
  if(!url) return '';
  let m=String(url).match(/[-\w]{25,}/);
  if(!m) return '';
  return 'https://drive.google.com/thumbnail?id='+m[0]+'&sz=w'+(size||800);
}
// Normalize a registration for fuzzy matching (strip dashes/spaces, uppercase).
function normReg(r){ return (r||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
// Pick a value from a row by fuzzy header keyword (tolerates bracket suffixes / whitespace).
function pick(row,keywords){
  for(const k of Object.keys(row)){
    const lk=k.toLowerCase();
    if(keywords.some(w=>lk.includes(w))) { const v=(row[k]||'').toString().trim(); if(v) return v; }
  }
  return '';
}
async function fetchFleetDB(){
  try{
    const res=await fetch(FLEET_URL);
    const text=await res.text();
    const grid=parseCSV(text);
    if(grid.length<2) throw new Error('Fleet sheet empty or unreadable');
    const headers=grid[0].map(h=>h.trim());
    const rows=grid.slice(1).map(cells=>{
      const o={};
      headers.forEach((h,i)=>{ if(h) o[h]=cells[i]||''; });
      return o;
    });
    const map={};
    rows.forEach(row=>{
      const reg=pick(row,['registration']) || row['REGISTRATION'] || '';
      if(!reg) return;
      const key=normReg(reg);
      if(!key||map[key]) return; // first entry wins
      map[key]={
        reg, nosename:pick(row,['nosename','nose name']),
        type:pick(row,['aircraft type']),
        division:pick(row,['division']),
        colour:pick(row,['colour','color scheme']),
        modder:pick(row,['modder']),
        state:pick(row,['state']),
        image:driveThumb(pick(row,['aircraft image','image']),800),
      };
    });
    FLEET_BY_REG=map; _dbgFleet=Object.keys(map).length;
    console.info('[FleetDB] Loaded',_dbgFleet,'airframes');
  }catch(err){
    _dbgFleet=0;
    console.warn('[FleetDB] Failed to load:',err.message);
  }
}
// Look up fleet record for a registration, exact then normalized.
function fleetFor(reg){
  if(!reg) return null;
  return FLEET_BY_REG[normReg(reg)]||null;
}

// ═══════════════════════════════════════════════════════
// FALLBACK PIREP DATA (used if API is unavailable)
// ═══════════════════════════════════════════════════════
const FALLBACK_PIREPS = [
  { flight:'AJV235', color:'#F99420', pilot:'FreezingFalcon', sim:'MSFS 2020',
    aircraft:'Airbus A321-200', reg:'PK-AJR', network:'VATSIM',
    origin:{icao:'WIHH', name:'Jakarta Halim Perdanakusuma', lat:-6.267, lon:106.891},
    dest:{icao:'VTBS', name:'Bangkok Suvarnabhumi', lat:13.681, lon:100.747},
    dep:'12:30', arr:'16:06', airtime:'3h 08m', date:'24 MAY 2025',
    eval:'Floated too much on landing. Touched down slightly beyond the final touchdown zone marking out of VTBS RWY 20R. Barely legal landing.' },
  { flight:'AJV155', color:'#E63862', pilot:'FreezingFalcon', sim:'MSFS 2020',
    aircraft:'Boeing 727-200Adv', reg:'F-AJAA', network:'VATSIM',
    origin:{icao:'WAHS', name:'Semarang Ahmad Yani', lat:-6.970, lon:110.374},
    dest:{icao:'WIPP', name:'Palembang Sultan Mahmud Badaruddin II', lat:-2.898, lon:104.700},
    dep:'08:40', arr:'10:32', airtime:'1h 24m', date:'25 MAY 2025',
    eval:'Some autopilot issues during the climb phase. The IAS hold mode did put the aircraft in a descend for a brief moment before it went back climbing.' }
];

const BRAND_COLORS = ['#F99420','#E63862','#F5C624','#F55D5D','#ED7B5E','#B8195A','#7A1F4A'];

let PIREPS = [...FALLBACK_PIREPS];

// ═══════════════════════════════════════════════════════
// OPENSHEET DATA PARSER
// ═══════════════════════════════════════════════════════
const API_URL     = 'https://opensheet.elk.sh/1BeLTYOaEOn7o8h-VO6N80fe_C7H0z8fhB7nyksqmck4/VATSIM%20Auto%20PIREP';
const OLD_API_URL = 'https://opensheet.elk.sh/1BeLTYOaEOn7o8h-VO6N80fe_C7H0z8fhB7nyksqmck4/Flight%20Log%20Entries';
let lastFetched = 0;

function extractICAO(str) {
  if (!str) return null;
  str = str.trim();
  // Pure 4-letter code
  if (/^[A-Za-z]{4}$/.test(str)) return str.toUpperCase();
  // "(ICAO)" or "(ICAO/...)"
  let m = str.match(/\(([A-Za-z]{4})[\/\)]/);
  if (m) return m[1].toUpperCase();
  // "ICAO - Name" or "ICAO: Name"
  m = str.match(/^([A-Za-z]{4})[\s\-:]/);
  if (m) return m[1].toUpperCase();
  // Any standalone 4-letter word
  m = str.match(/\b([A-Za-z]{4})\b/);
  return m ? m[1].toUpperCase() : null;
}
function cleanAirportName(str) {
  if (!str) return str;
  return str.replace(/\s*\([^)]+\)\s*$/, '').trim();
}
function fmtTime(str) {
  if (!str) return '';
  const m = str.match(/(\d+):(\d+)/);
  if (!m) return str;
  let h = parseInt(m[1]), min = m[2];
  if (/pm/i.test(str) && h !== 12) h += 12;
  if (/am/i.test(str) && h === 12) h = 0;
  return String(h).padStart(2,'0') + ':' + min;
}
function fmtAirtime(str) {
  if (!str) return '';
  const raw = str.toString().trim();
  // Pure minutes number e.g. "84"
  if (/^\d+$/.test(raw)) {
    const mins = parseInt(raw);
    return `${Math.floor(mins/60)}h ${String(mins%60).padStart(2,'0')}m`;
  }
  const m = raw.match(/(\d+):(\d+)/);
  if (!m) return raw;
  return `${parseInt(m[1])}h ${m[2]}m`;
}
function fmtDate(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d)) return str;
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase();
}
function airtimeToMinutes(str) {
  if (!str) return 0;
  const m = str.match(/(\d+)h\s*(\d+)m/);
  if (m) return parseInt(m[1])*60 + parseInt(m[2]);
  const t = str.match(/(\d+):(\d+)/);
  if (t) return parseInt(t[1])*60 + parseInt(t[2]);
  return 0;
}
function minutesToHM(mins) {
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}:${String(m).padStart(2,'0')}`;
}

function normSim(s) {
  return (s || '')
    .replace('Microsoft Flight Simulator 2020','MSFS 2020')
    .replace('Microsoft Flight Simulator','MSFS')
    .replace('X-Plane 12','XP12').replace('X-Plane 11','XP11').trim();
}

const SUBSIDIARY_MAP = {
  "AJV":"Abel Jets MCC","AJP":"Abel Jets Platinum","HAD":"Holi-Abel-Day!",
  "APX":"Abel Pixel","SJP":"Abel Jump","AEX":"Abel Executive",
  "HEL":"Abel Helicopters","AXP":"Abel Xplore","ACS":"Abel Cargo Expeditionary Service",
  "ICT":"ACES Insane Cargo Transporter","TCC":"ACES Time-Critical Cargo",
  "CSM":"Abel Cosmos","AFT":"Abel Fire and Rescue","AFS":"Abel Aviateur",
  "ARF":"Abel Retro","OST":"Orange Skies Aerobatic Team","ATS":"Abel Transit!",

function getSubsidiaryFromCallsign(callsign) {
  if (!callsign) return '';
  const cs = String(callsign).trim().toUpperCase();
  if (cs.startsWith('AJV')) {
    const last = cs.slice(-1);
    if (!isNaN(last)) return 'Abel Jets MCC';
    return _AJV_SUFFIX_MAP[last] || '';
  }
  const prefix = cs.substring(0, 3);
  return SUBSIDIARY_MAP[prefix] || _ICAO_SUB_MAP[prefix] || '';
}

function parseRow(row) {
  const originICAO = extractICAO(row['Departure Airport']);
  const destICAO   = extractICAO(row['Arrival Airport']);
  const originC    = AIRPORT_COORDS[originICAO];
  const destC      = AIRPORT_COORDS[destICAO];
  if (!originC || !destC) {
    console.warn('[PIREP] Unknown airport(s):', originICAO, destICAO, '— skipping');
    return null;
  }
  const callsign = row['Callsign'] || 'UNK';
  return {
    flight:     callsign,
    color:      '#F99420',
    pilot:      row['Name'] || 'Unknown',
    sim:        normSim(row['Flight Simulator']),
    aircraft:   row['Aircraft ICAO Code'] || '',
    reg:        row['Aircraft Registration'] || '',
    network:    'VATSIM',
    subsidiary: getSubsidiaryFromCallsign(callsign),
    origin:     { icao: originICAO, name: cleanAirportName(row['Departure Airport']) || originC.name, lat: originC.lat, lon: originC.lon },
    dest:       { icao: destICAO,   name: cleanAirportName(row['Arrival Airport'])   || destC.name,   lat: destC.lat,  lon: destC.lon  },
    dep:        fmtTime(row['Departure Time (UTC)']),
    arr:        fmtTime(row['Arrival Time (UTC)']),
    airtime:    fmtAirtime(row['Block Time (min)']),
    date:       fmtDate(row['Log Timestamp']),
    eval:       row['Self Evaluation'] || '',
    route:      pick(row,['route','flight plan','fpl','filed']) || '',
    _rawTimestamp: row['Log Timestamp'] || '',
  };
}

function parseOldRow(row) {

  const originC    = AIRPORT_COORDS[originICAO];

function assignPilotColors(pireps) {
  const pilotMap = {};
  pireps.forEach(p => { if (!(p.pilot in pilotMap)) pilotMap[p.pilot] = Object.keys(pilotMap).length; });
  pireps.forEach(p => { p.color = BRAND_COLORS[pilotMap[p.pilot] % BRAND_COLORS.length]; });
}

async function fetchPIREPs() {
  try {
    setLdTxt('FETCHING FLIGHT DATA…');
    const [newRes, oldRes] = await Promise.allSettled([fetch(API_URL), fetch(OLD_API_URL)]);

    let newParsed = [], oldParsed = [];

    if (newRes.status === 'fulfilled') {
      const rows = await newRes.value.json();
      _dbgRawKeys = rows[0] ? Object.keys(rows[0]) : [];
      newParsed = rows.map(parseRow).filter(Boolean);
      console.info('[PIREP API] New sheet:', newParsed.length, 'flights');
    } else {
      console.warn('[PIREP API] New sheet failed:', newRes.reason);
    }

    if (oldRes.status === 'fulfilled') {
      const rows = await oldRes.value.json();
      oldParsed = rows.map(parseOldRow).filter(Boolean);
      console.info('[PIREP API] Old sheet:', oldParsed.length, 'flights');
    } else {
      console.warn('[PIREP API] Old sheet failed:', oldRes.reason);
    }

    const combined = [...newParsed, ...oldParsed];
    if (!combined.length) throw new Error('No flights parsed from either sheet');

    combined.sort((a,b) => new Date(b._rawTimestamp) - new Date(a._rawTimestamp));
    assignPilotColors(combined);

    PIREPS = combined;
    _dbgLastFetch = new Date().toISOString();
    _dbgPireps = combined.length; _dbgFallback = false; _dbgErr = null;
    lastFetched = Date.now(); _nextRefreshAt = Date.now()+60000;
    console.info('[PIREP API] Total loaded:', combined.length, 'flights');
  } catch(err) {
    _dbgErr = err.message; _dbgFallback = true;
    console.warn('[PIREP API] Using fallback data:', err.message);
    PIREPS = [...FALLBACK_PIREPS];
    _nextRefreshAt = Date.now()+60000;
  }
}

// GEOMETRY HELPERS
// ═══════════════════════════════════════════════════════
function ll2v(lat,lon,r=1){
  const phi=(90-lat)*Math.PI/180,theta=(lon+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
}
function slerp(a,b,t){
  const na=a.clone().normalize(),nb=b.clone().normalize();
  const d=Math.max(-1,Math.min(1,na.dot(nb))),o=Math.acos(d);
  if(Math.abs(o)<1e-4) return na.lerp(nb,t).normalize();
  return na.multiplyScalar(Math.sin((1-t)*o)).add(nb.multiplyScalar(Math.sin(t*o))).divideScalar(Math.sin(o));
}
function buildCurve(latA,lonA,latB,lonB,h){
  const vA=ll2v(latA,lonA),vB=ll2v(latB,lonB),pts=[];
  for(let i=0;i<=80;i++){const t=i/80;pts.push(slerp(vA.clone(),vB.clone(),t).multiplyScalar(1+h*Math.sin(t*Math.PI)));}
  return new THREE.CatmullRomCurve3(pts);
}
function setProgress(pct,msg){
  document.getElementById('ldFill').style.width=pct+'%';
  if(msg) setLdTxt(msg);

// ═══════════════════════════════════════════════════════
// FILED-ROUTE RESOLUTION (airac.net nav data)
// Parse the ICAO route string → resolve each fix to lat/lon →
// draw the arc through the fixes. Falls back to great-circle.
// ═══════════════════════════════════════════════════════
const AIRAC_BASE='https://airac.net/api/v1';
const NAVCACHE_KEY='pirep_navcache_v1';
let navCache={};
try{ navCache=JSON.parse(localStorage.getItem(NAVCACHE_KEY)||'{}'); }catch(e){ navCache={}; }
let _navSaveT=null;
function persistNavCache(){
  clearTimeout(_navSaveT);
  _navSaveT=setTimeout(()=>{ try{ localStorage.setItem(NAVCACHE_KEY,JSON.stringify(navCache)); }catch(e){} },500);
}
// airac.net reachability state + debug counters
let _airacDead=false, _airacFail=0, _airacOK=0;
let _dbgRoutesTotal=0, _dbgRoutesResolved=0;

function haversineKm(aLat,aLon,bLat,bLon){
  const R=6371,dLa=(bLat-aLat)*Math.PI/180,dLo=(bLon-aLon)*Math.PI/180;
  const la1=aLat*Math.PI/180,la2=bLat*Math.PI/180;
  const x=Math.sin(dLa/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
// Recursively locate a plausible {lat,lon} pair inside an arbitrary JSON object.
function findLatLon(o,depth){
  if(depth>6||!o||typeof o!=='object') return null;
  let lat=null,lon=null;
  for(const k of Object.keys(o)){
    const v=o[k], lk=k.toLowerCase();
    if(typeof v==='number'){
      if(lat===null&&/^(lat|latitude|lat_deg|latitude_deg|y)$/.test(lk)) lat=v;
      else if(lon===null&&/^(lon|lng|long|longitude|lon_deg|longitude_deg|x)$/.test(lk)) lon=v;
    }
  }
  if(lat!==null&&lon!==null&&Math.abs(lat)<=90&&Math.abs(lon)<=180) return {lat,lon};
  for(const k of Object.keys(o)){ const r=findLatLon(o[k],(depth||0)+1); if(r) return r; }
  return null;
}
// Turn an API response into a list of candidate coordinates.
function extractCandidates(json){
  let arr=null;
  if(Array.isArray(json)) arr=json;
  else if(json&&typeof json==='object'){
    for(const k of ['data','results','waypoints','navaids','items','fixes','records']){
      if(Array.isArray(json[k])){ arr=json[k]; break; }
    }
    if(!arr){ const s=findLatLon(json,0); return s?[s]:[]; }
  }
  return (arr||[]).map(x=>findLatLon(x,0)).filter(Boolean);
}
// Resolve one fix ident to {lat,lon}, choosing the candidate nearest (nearLat,nearLon).
async function resolveFix(ident,nearLat,nearLon){
  const key=ident.toUpperCase();
  if(key in navCache) return navCache[key];
  if(_airacDead) return null;
  let cands=[];
  for(const ep of ['waypoints','navaids']){
    try{
      const res=await fetch(`${AIRAC_BASE}/${ep}/${encodeURIComponent(key)}`,{headers:{'Accept':'application/json'}});
      _airacOK++;                        // a real HTTP response means CORS is fine
      if(!res.ok) continue;
      const c=extractCandidates(await res.json());
      cands=cands.concat(c);
      if(c.length) break;
    }catch(e){
      _airacFail++;
      if(_airacOK===0&&_airacFail>=4){ _airacDead=true; console.warn('[AIRAC] unreachable (CORS/network) — using direct arcs'); }
      return null;
    }
  }
  if(!cands.length){ navCache[key]=null; persistNavCache(); return null; }
  let best=cands[0];
  if(nearLat!=null){
    let bd=Infinity;
    cands.forEach(c=>{ const d=haversineKm(nearLat,nearLon,c.lat,c.lon); if(d<bd){bd=d;best=c;} });
  }
  navCache[key]=best; persistNavCache();
  return best;
}
// Tokenize an ICAO route string into an ordered list of fix idents.
function parseRouteFixes(routeStr){
  if(!routeStr) return [];
  const out=[];
  String(routeStr).trim().split(/\s+/).forEach(raw=>{
    let tok=raw.split('/')[0].toUpperCase();       // drop /N0494F360 speed-level changes
    if(!tok||['DCT','SID','STAR'].includes(tok)) return;
    if(/\d/.test(tok)){
      const m=tok.match(/^([A-Z]{2,5})\d[A-Z]$/);  // SID/STAR e.g. VETAG1G → VETAG
      if(m){ if(out[out.length-1]!==m[1]) out.push(m[1]); }
      return;                                        // airways (M646, Y57…) are connectors → skip
    }
    if(/^[A-Z]{2,5}$/.test(tok)&&out[out.length-1]!==tok) out.push(tok);
  });
  return out;
}
// Resolve every fix in a PIREP's route; store polyline points if enough resolve.
async function resolveRouteForPirep(p){
  p._routeTried=true;
  const fixes=parseRouteFixes(p.route);
  if(!fixes.length) return;
  const pts=[]; let near=[p.origin.lat,p.origin.lon];
  for(const f of fixes){
    const c=await resolveFix(f,near[0],near[1]);
    if(c){ pts.push({lat:c.lat,lon:c.lon}); near=[c.lat,c.lon]; }
    if(_airacDead) break;
  }
  if(pts.length>=1&&pts.length>=Math.ceil(fixes.length*0.5)){
    p._routePts=[{lat:p.origin.lat,lon:p.origin.lon},...pts,{lat:p.dest.lat,lon:p.dest.lon}];
  }
}
// Resolve all routes in the background (bounded concurrency), then rebuild arcs once.
async function resolveAllRoutes(){
  if(!filedRoute||_airacDead) return;
  const list=PIREPS.filter(p=>p.route&&!p._routeTried);
  _dbgRoutesTotal=PIREPS.filter(p=>p.route).length;
  if(!list.length){ _dbgRoutesResolved=PIREPS.filter(p=>p._routePts).length; return; }
  let idx=0, changed=false;
  async function worker(){
    while(idx<list.length&&!_airacDead){
      const p=list[idx++];
      await resolveRouteForPirep(p);
      if(p._routePts) changed=true;
    }
  }
  await Promise.all(Array.from({length:4},worker));
  _dbgRoutesResolved=PIREPS.filter(p=>p._routePts).length;
  if(changed&&globe&&!densityMode){ buildFlights(); applyFlightVisibility(); }
  if(document.getElementById('dbgPanel').classList.contains('vis')) refreshDebug();
}
// Build a raised CatmullRom curve through an ordered list of {lat,lon} points.
function buildRouteCurve(points,h){
  const vs=points.map(pt=>ll2v(pt.lat,pt.lon));
  const raw=[];
  for(let s=0;s<vs.length-1;s++){
    const a=vs[s],b=vs[s+1];
    for(let i=0;i<20;i++) raw.push(slerp(a.clone(),b.clone(),i/20));
  }
  raw.push(vs[vs.length-1].clone());
  const n=raw.length;
  const pts=raw.map((v,i)=>{ const t=i/(n-1); return v.clone().normalize().multiplyScalar(1+h*Math.sin(t*Math.PI)); });
  return new THREE.CatmullRomCurve3(pts);
}
// Pick the filed-route curve when available & enabled, else the great-circle arc.
function curveForPirep(p){
  if(filedRoute&&p._routePts&&p._routePts.length>=3) return buildRouteCurve(p._routePts,arcH);
  return buildCurve(p.origin.lat,p.origin.lon,p.dest.lat,p.dest.lon,arcH);
}
function toggleFiledRoute(){
  filedRoute=!filedRoute;
  document.getElementById('routeBtn').classList.toggle('on',filedRoute);
  if(globe&&!densityMode){ buildFlights(); applyFlightVisibility(); }
  if(filedRoute) resolveAllRoutes();
}

      side:THREE.BackSide,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false
    })));
    globe.add(new THREE.Mesh(new THREE.SphereGeometry(1.035,64,64),new THREE.MeshBasicMaterial({color:0x6ebaff,transparent:true,opacity:0.08,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false})));

    // Grid
    const gm=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.06});
    for(let la=-75;la<=75;la+=15){const p=[];for(let lo=0;lo<=360;lo+=4)p.push(ll2v(la,lo,1.002));globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),gm));}
    for(let lo=0;lo<360;lo+=15){const p=[];for(let la=-90;la<=90;la+=4)p.push(ll2v(la,lo,1.002));globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p),gm));}

    setProgress(90,'PLOTTING ROUTES…');
    buildAirports();
    buildFlights();
    setProgress(100,'READY');
    setTimeout(()=>{
      document.getElementById('loading').classList.add('hide');
      renderFlightList();
      renderBottomBar();
      updateStats();
      animate();
      resolveAllRoutes();   // upgrade arcs to filed routes in the background
    },600);
  }
});

// ═══════════════════════════════════════════════════════
// DYNAMIC AIRPORT MARKERS
// ═══════════════════════════════════════════════════════
function buildAirports(){
  // Remove old markers
  airportMarkers.forEach(m=>{globe.remove(m.dot);globe.remove(m.halo);globe.remove(m.ring);});
  airportMarkers=[]; pulseRings=[];
  document.querySelectorAll('.albl').forEach(el=>el.remove());

  // Collect unique airports from current PIREPs
  const seen={};
  PIREPS.forEach(p=>{
    [p.origin,p.dest].forEach(ap=>{
      if(!seen[ap.icao]) seen[ap.icao]={...ap};
    });
  });

  Object.values(seen).forEach(ap=>{
    const v=ll2v(ap.lat,ap.lon,1.009);
    const c=new THREE.Color('#F99420');

    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.011,10,10),new THREE.MeshBasicMaterial({color:c,blending:THREE.AdditiveBlending,depthWrite:false}));
    dot.position.copy(v);globe.add(dot);

    const halo=new THREE.Mesh(new THREE.SphereGeometry(0.022,10,10),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.2,blending:THREE.AdditiveBlending,depthWrite:false}));
    halo.position.copy(v);globe.add(halo);

    const rmat=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.6,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
    const ring=new THREE.Mesh(new THREE.RingGeometry(0.015,0.021,32),rmat);
    ring.position.copy(v);ring.lookAt(new THREE.Vector3(0,0,0));
    ring.userData={t:Math.random(),mat:rmat};
    globe.add(ring);pulseRings.push(ring);

    // DOM label
    const lbl=document.createElement('div');
    lbl.className='albl';
    lbl.id='lbl-'+ap.icao;
    lbl.textContent=ap.icao;
    lbl.addEventListener('click',()=>handleLabelClick(ap.icao,lbl));
    document.body.appendChild(lbl);

    airportMarkers.push({icao:ap.icao,dot,halo,ring,pos:v.clone(),lbl});
  });

  buildNationLabels(seen);
}

// ═══════════════════════════════════════════════════════
// LEVEL-OF-DETAIL LABELS
// close → airport ICAOs · mid → country pills · far → continent pills
// ═══════════════════════════════════════════════════════
let nationMarkers=[], continentMarkers=[];
const ZOOM_NATION=3.2;    // camZ beyond this → country pills
const ZOOM_CONTINENT=4.6; // camZ beyond this → continent pills
const CONTINENT_NAMES={AS:'ASIA',EU:'EUROPE',NA:'N AMERICA',SA:'S AMERICA',
  AF:'AFRICA',OC:'OCEANIA',AN:'ANTARCTICA'};

function labelBand(){
  if(camZ>ZOOM_CONTINENT&&continentMarkers.length) return 'continent';
  if(camZ>ZOOM_NATION&&nationMarkers.length) return 'nation';
  return 'airport';
}
function focusCentroid(centroid,zoom){
  trgZ=zoom;
  const c=centroid.clone().normalize();
  trgY=Math.atan2(-c.x,c.z);
  trgX=Math.asin(Math.max(-1,Math.min(1,c.y)));
}
function buildNationLabels(seen){
  nationMarkers=[]; continentMarkers=[];
  const byCountry={}, byContinent={};
  Object.values(seen).forEach(ap=>{
    const meta=AIRPORT_COORDS[ap.icao];
    if(!meta) return;
    if(meta.country) (byCountry[meta.country]=byCountry[meta.country]||[]).push(ap);
    if(meta.continent) (byContinent[meta.continent]=byContinent[meta.continent]||[]).push(ap);
  });
  Object.entries(byCountry).forEach(([cc,aps])=>{
    const centroid=new THREE.Vector3();
    aps.forEach(ap=>centroid.add(ll2v(ap.lat,ap.lon,1)));
    centroid.normalize().multiplyScalar(1.02);
    const lbl=document.createElement('div');
    lbl.className='albl nation';
    lbl.innerHTML=`${countryFlag(cc)} ${cc}<span class="albl-count">${aps.length}</span>`;
    lbl.title=aps.map(a=>a.icao).join(' · ');
    lbl.addEventListener('click',()=>focusCentroid(centroid,2.2));
    document.body.appendChild(lbl);
    nationMarkers.push({cc,pos:centroid,lbl,icaos:aps.map(a=>a.icao)});
  });
  Object.entries(byContinent).forEach(([code,aps])=>{
    const centroid=new THREE.Vector3();
    aps.forEach(ap=>centroid.add(ll2v(ap.lat,ap.lon,1)));
    centroid.normalize().multiplyScalar(1.02);
    const lbl=document.createElement('div');
    lbl.className='albl nation';
    lbl.innerHTML=`${CONTINENT_NAMES[code]||code}<span class="albl-count">${aps.length}</span>`;
    lbl.title=aps.map(a=>a.icao).join(' · ');
    lbl.addEventListener('click',()=>focusCentroid(centroid,3.8));
    document.body.appendChild(lbl);
    continentMarkers.push({code,pos:centroid,lbl,icaos:aps.map(a=>a.icao)});
  });
}

// ═══════════════════════════════════════════════════════
// FLIGHT ARC BUILDING
// ═══════════════════════════════════════════════════════
function buildFlights(){
  flights.forEach(f=>{
    globe.remove(f.arcMesh);f.arcMesh.geometry.dispose();
    if(f.plane) globe.remove(f.plane);
    if(f.trail)  globe.remove(f.trail.line);
  });
  flights=[];
  if(densityMode){buildDensityFlights();return;}
  const seenRoutes=new Set();
  PIREPS.forEach((p,i)=>{
    const curve=curveForPirep(p);
    const mat=new THREE.MeshBasicMaterial({color:new THREE.Color(p.color),transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false});
    const arcMesh=new THREE.Mesh(new THREE.TubeGeometry(curve,80,0.0018,5,false),mat);
    globe.add(arcMesh);
    const routeKey=p.origin.icao+'-'+p.dest.icao;
    const isNew=!seenRoutes.has(routeKey);
    if(isNew) seenRoutes.add(routeKey);
    const plane=isNew?makePlane(p.color):null; if(plane) globe.add(plane);
    const trail=isNew?new Trail(p.color,60):null; if(trail) globe.add(trail.line);
    flights.push({curve,arcMesh,plane,trail,t:Math.random(),speed:0.007+Math.random()*0.004,color:p.color,mat,pireps:[p],baseOpacity:0.85});
  });
}

// ═══════════════════════════════════════════════════════
// ROUTE DENSITY HEATMAP
// ═══════════════════════════════════════════════════════
function routeGroups(){
  // Group PIREPs by unordered airport pair — A→B and B→A form one corridor
  const groups={};
  PIREPS.forEach(p=>{
    const key=[p.origin.icao,p.dest.icao].sort().join('-');
    if(!groups[key]) groups[key]={a:p.origin,b:p.dest,pireps:[]};
    groups[key].pireps.push(p);
  });
  return Object.values(groups);
}
function densityColor(f){ // 0..1 → gold → orange → magenta
  const c=new THREE.Color('#F5C624');
  if(f<0.5) c.lerp(new THREE.Color('#F99420'),f*2);
  else{ c.set('#F99420'); c.lerp(new THREE.Color('#E63862'),(f-0.5)*2); }
  return c;
}
function buildDensityFlights(){
  const groups=routeGroups();
  const max=Math.max(1,...groups.map(g=>g.pireps.length));
  document.getElementById('dlMax').textContent=max>1?'1–'+max+' FLTS':'1 FLT';
  groups.forEach(g=>{
    const n=g.pireps.length, f=max>1?(n-1)/(max-1):1;
    const col=densityColor(f), hex='#'+col.getHexString();
    const curve=buildCurve(g.a.lat,g.a.lon,g.b.lat,g.b.lon,arcH*(0.75+0.5*f));
    const baseOpacity=0.35+0.55*f;
    const mat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:baseOpacity,blending:THREE.AdditiveBlending,depthWrite:false});
    const arcMesh=new THREE.Mesh(new THREE.TubeGeometry(curve,80,0.0018+0.0052*f,6,false),mat);
    globe.add(arcMesh);
    const plane=makePlane(hex); globe.add(plane);
    const trail=new Trail(hex,60); globe.add(trail.line);
    flights.push({curve,arcMesh,plane,trail,t:Math.random(),speed:0.007+Math.random()*0.004,color:hex,mat,pireps:g.pireps,baseOpacity});
  });
}
function toggleDensity(){
  densityMode=!densityMode;
  document.getElementById('densityBtn').classList.toggle('on',densityMode);
  document.getElementById('densLegend').classList.toggle('vis',densityMode);
  if(globe){buildFlights();applyFlightVisibility();}
}

function makePlane(color){
  const g=new THREE.Group(),c=new THREE.Color(color);
  const mat=new THREE.MeshPhongMaterial({color:c,emissive:c,emissiveIntensity:0.4,shininess:60});
  const gm=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false});
  const s=0.032;
  const f=new THREE.Mesh(new THREE.CylinderGeometry(s*.07,s*.055,s*1.2,8),mat);f.rotation.z=Math.PI/2;g.add(f);
  const n=new THREE.Mesh(new THREE.ConeGeometry(s*.07,s*.25,8),mat);n.rotation.z=-Math.PI/2;n.position.x=s*.7;g.add(n);
  const w=new THREE.Mesh(new THREE.BoxGeometry(s*.32,s*.025,s*1.05),mat);w.position.x=s*.08;g.add(w);
  [[s*.55],[-s*.55]].forEach(([z])=>{const wl=new THREE.Mesh(new THREE.BoxGeometry(s*.06,s*.18,s*.025),mat);wl.position.set(s*.08,s*.09,z);g.add(wl);});
  const hs=new THREE.Mesh(new THREE.BoxGeometry(s*.2,s*.02,s*.44),mat);hs.position.x=-s*.52;g.add(hs);
  const vs=new THREE.Mesh(new THREE.BoxGeometry(s*.18,s*.28,s*.025),mat);vs.position.set(-s*.44,s*.14,0);g.add(vs);
  [[s*.34],[-s*.34]].forEach(([z])=>{
    const en=new THREE.Mesh(new THREE.CylinderGeometry(s*.09,s*.09,s*.28,8),mat);en.rotation.z=Math.PI/2;en.position.set(s*.09,-s*.05,z);g.add(en);
    const eg=new THREE.Mesh(new THREE.CircleGeometry(s*.07,8),gm);eg.position.set(-s*.05,-s*.05,z);eg.rotation.y=Math.PI/2;g.add(eg);
  });
  const mkN=(col,pos)=>{const nm=new THREE.MeshBasicMaterial({color:new THREE.Color(col),transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false});const nl=new THREE.Mesh(new THREE.SphereGeometry(s*.06,6,6),nm);nl.position.set(...pos);g.add(nl);return nm;};
  g.userData.navL=mkN('#ff2222',[s*.09,-s*.02,s*.55]);
  g.userData.navR=mkN('#00ff66',[s*.09,-s*.02,-s*.55]);
  g.userData.beacon=mkN('#ffffff',[0,s*.12,0]);
  return g;
}

class Trail{
  constructor(color,n=60){
    this.n=n;this.pts=[];
    this.geo=new THREE.BufferGeometry();
    const pa=new Float32Array(n*3);
    this.geo.setAttribute('position',new THREE.BufferAttribute(pa,3));
    this.geo.setDrawRange(0,0);
    this.line=new THREE.Line(this.geo,new THREE.LineBasicMaterial({color:new THREE.Color(color),transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false}));
  }
  push(p){
    this.pts.unshift(p.clone());if(this.pts.length>this.n)this.pts.pop();
    const a=this.geo.attributes.position;
    this.pts.forEach((v,i)=>a.setXYZ(i,v.x,v.y,v.z));
    a.needsUpdate=true;this.geo.setDrawRange(0,this.pts.length);
  }
}

// ═══════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(),t=clock.getElapsedTime();
  // Camera rotation — lock to selected flight midpoint (spherical) or normal auto-rotate
  if(selectedPIREP&&!isDrag){
    const va=ll2v(selectedPIREP.origin.lat,selectedPIREP.origin.lon);
    const vb=ll2v(selectedPIREP.dest.lat,selectedPIREP.dest.lon);
    const mid=va.clone().add(vb).normalize();
    trgY=Math.atan2(-mid.x,mid.z);
    trgX=Math.asin(Math.max(-1,Math.min(1,mid.y)));
  } else if(!isDrag){ trgY+=autoRot; }
  rotX+=(trgX-rotX)*.04;
  let dY=trgY-rotY; while(dY>Math.PI)dY-=2*Math.PI; while(dY<-Math.PI)dY+=2*Math.PI;
  rotY+=dY*.04;
  camZ+=(trgZ-camZ)*.08; camera.position.z=camZ;
  if(globe){globe.rotation.x=rotX;globe.rotation.y=rotY;}
  if(window._cloudMesh) window._cloudMesh.rotation.y+=dt*.008;
  if(window._earthMat&&window._earthMat.userData.shader){
    const sl=sunLight.position.clone().normalize().applyMatrix4(new THREE.Matrix4().extractRotation(globe.matrixWorld).invert());
    window._earthMat.userData.shader.uniforms.sunDir.value.copy(sl);
  }
  // Zoom scale for effects
  const zS=Math.min(Math.max(camZ/2.8,0.35),1.4);
  pulseRings.forEach(r=>{r.userData.t=(r.userData.t+dt*.42)%1;const pt=r.userData.t;r.scale.setScalar((1+pt*3.5*zS)*zS);r.userData.mat.opacity=(1-pt)*.5*Math.min(1,zS);});
  airportMarkers.forEach((mk,i)=>{mk.halo.scale.setScalar((1+.3*Math.abs(Math.sin(t*1.5+i)))*zS);mk.dot.scale.setScalar(zS);});
  // Arc highlight for selected flight
  if(selectedPIREP){
    flights.forEach(fl=>{
      if(!fl.mat) return;
      fl.mat.opacity=fl.pireps.includes(selectedPIREP)?1.0:0.12;
    });
  }
  flights.forEach((fl,i)=>{
    fl.t=(fl.t+dt*fl.speed)%1;
    if(!fl.plane) return;
    const pos=fl.curve.getPoint(fl.t),tan=fl.curve.getTangent(fl.t).normalize();
    const up=pos.clone().normalize(),right=new THREE.Vector3().crossVectors(tan,up).normalize();
    fl.plane.position.copy(pos);
    fl.plane.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(tan,new THREE.Vector3().crossVectors(right,tan),right));
    if(trailsOn&&fl.trail) fl.trail.push(pos);
    if(fl.plane.userData.navL)   fl.plane.userData.navL.opacity  =.5+.5*Math.sin(t*5+i*2);
    if(fl.plane.userData.navR)   fl.plane.userData.navR.opacity  =.5+.5*Math.sin(t*5+i*2+Math.PI);
    if(fl.plane.userData.beacon) fl.plane.userData.beacon.opacity=.4+.6*(Math.sin(t*3+i)>.6?1:0);
  });
  renderer.render(scene,camera);
  updateLabels();
}

function projectLabel(mk){
  const world=mk.pos.clone().applyMatrix4(globe.matrixWorld);
  const proj=world.clone().project(camera);
  const visible=proj.z<1&&world.clone().normalize().dot(world.clone().sub(camera.position).normalize())<-0.12;
  mk.lbl.style.left=((proj.x+1)/2*innerWidth)+'px';
  mk.lbl.style.top=((-proj.y+1)/2*innerHeight)+'px';
  return visible;
}
function updateLabels(){
  if(!globe||!camera)return;
  const band=labelBand();
  airportMarkers.forEach(mk=>{
    const visible=projectLabel(mk);
    mk.lbl.classList.toggle('show',band==='airport'&&visible&&mk.dot.visible);
  });
  nationMarkers.forEach(nm=>{
    const anyVisible=airportMarkers.some(mk=>nm.icaos.includes(mk.icao)&&mk.dot.visible);
    const visible=projectLabel(nm);
    nm.lbl.classList.toggle('show',band==='nation'&&visible&&anyVisible);
  });
  continentMarkers.forEach(cm=>{
    const anyVisible=airportMarkers.some(mk=>cm.icaos.includes(mk.icao)&&mk.dot.visible);
    const visible=projectLabel(cm);
    cm.lbl.classList.toggle('show',band==='continent'&&visible&&anyVisible);
  });
}

window.addEventListener('resize',()=>{
  if(!camera||!renderer)return;
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

let activeFilter='';
function shortName(n){ const w=n.trim().split(/\s+/); return w.length>1?w[0]+' '+w[w.length-1][0]+'.':w[0]; }
function renderPilotChips(){
  const pilots=['All',...new Set(PIREPS.map(p=>p.pilot))];
  document.getElementById('pilotChips').innerHTML=pilots.map(name=>{
    const label=name==='All'?'All':shortName(name);

         title="${name}" onclick="setPilotFilter('${name==='All'?'':name}')">${label}</div>`;
  }).join('');
}
function applyFlightVisibility(){
  const q=activeFilter.toLowerCase();
  const activeAirports=new Set();
  if(q){
    PIREPS.filter(p=>p.pilot.toLowerCase().includes(q))
          .forEach(p=>{activeAirports.add(p.origin.icao);activeAirports.add(p.dest.icao);});
  }
  flights.forEach(fl=>{
    const vis=!q||fl.pireps.some(p=>p.pilot.toLowerCase().includes(q));
    fl.arcMesh.visible=vis;
    if(fl.plane) fl.plane.visible=vis;
    if(fl.trail) fl.trail.line.visible=vis;
  });
  airportMarkers.forEach(mk=>{
    const vis=!q||activeAirports.has(mk.icao);
    mk.dot.visible=mk.halo.visible=mk.ring.visible=vis;
    if(!vis) mk.lbl.classList.remove('show');
  });
}
function setPilotFilter(name){
  activeFilter=name;
  currentPage=0;
  document.getElementById('pilotFilter').value=name;
  renderPilotChips();
  renderFlightList(name);
  updateStats();
  renderStatsBar();
  applyFlightVisibility();
  if(name) history.replaceState(null,'','?pilot='+encodeURIComponent(name));
  else history.replaceState(null,'',location.pathname);
}

// ═══════════════════════════════════════════════════════
// FLIGHT LIST + PAGINATION
// ═══════════════════════════════════════════════════════
const PAGE_SIZE=5;
let currentPage=0;
let _filtered=[];

function changePage(dir){
  const total=Math.ceil(_filtered.length/PAGE_SIZE);
  currentPage=Math.max(0,Math.min(currentPage+dir,total-1));
  renderFlightList();
}

function flightFor(i){
  const p=PIREPS[i];
  return flights.find(fl=>fl.pireps&&fl.pireps.includes(p));
}
function hoverCard(i){
  if(selectedPIREP) return;
  const fl=flightFor(i);
  if(fl&&fl.mat) fl.mat.opacity=1.0;
}
function unhoverCard(i){
  if(selectedPIREP) return;
  const fl=flightFor(i);
  if(fl&&fl.mat) fl.mat.opacity=fl.baseOpacity;
}

function renderFlightList(filter){
  if(filter!==undefined) currentPage=0;
  const q=(filter!==undefined?filter:activeFilter).toLowerCase();
  _filtered=PIREPS.filter(p=>!q||p.pilot.toLowerCase().includes(q));
  const list=document.getElementById('flightList');
  list.classList.add('fading');
  if(!_filtered.length){
    list.innerHTML='<div class="no-flights">No flights match this filter.</div>';
    document.getElementById('pagBar').style.display='none';
    requestAnimationFrame(()=>list.classList.remove('fading'));
    return;
  }
  const total=Math.ceil(_filtered.length/PAGE_SIZE);
  currentPage=Math.min(currentPage,total-1);
  const page=_filtered.slice(currentPage*PAGE_SIZE,(currentPage+1)*PAGE_SIZE);
  list.innerHTML=page.map(p=>{
    const i=PIREPS.indexOf(p);
    return `<div class="pcard" id="card${i}" style="--cc:${p.color}" data-idx="${i}"
      onclick="openDetail(${i})" onmouseover="hoverCard(${i})" onmouseleave="unhoverCard(${i})">
      <div class="card-top">
        <div><div class="cf">${p.flight}</div>${p.subsidiary?`<div class="csub">${p.subsidiary}</div>`:''}</div>
        <div class="ctime">${p.airtime}</div>
      </div>
      <div class="croute"><span>${p.origin.icao}</span><span class="carrow"> ──▶ </span><span>${p.dest.icao}</span></div>
      <div class="cinfo">${shortName(p.pilot)}${p.aircraft?' · '+p.aircraft:''} · ${p.date}</div>
    </div>`;
  }).join('');
  requestAnimationFrame(()=>list.classList.remove('fading'));
  // Pagination bar
  const bar=document.getElementById('pagBar');
  bar.style.display=total>1?'flex':'none';
  document.getElementById('pagInfo').textContent=`${currentPage+1} / ${total}`;
  document.getElementById('pagPrev').disabled=currentPage===0;
  document.getElementById('pagNext').disabled=currentPage===total-1;
  const el=document.getElementById('flightCount');
  if(el) el.textContent=_filtered.length;
  renderPilotChips();
}

document.getElementById('pilotFilter').addEventListener('input',function(){
  activeFilter=this.value;
  renderPilotChips();
  renderFlightList(this.value);
  updateStats();
  renderStatsBar();
  applyFlightVisibility();
});

// ═══════════════════════════════════════════════════════
// DETAIL VIEW
// ═══════════════════════════════════════════════════════
function openDetail(i){
  const p=PIREPS[i];
  const fleet=fleetFor(p.reg);
  const oMeta=airportMeta(p.origin.icao), dMeta=airportMeta(p.dest.icao);
  const acBlock=fleet&&fleet.image?`
    <div class="dac">
      <img class="dac-img" src="${fleet.image}" alt="${p.reg}" loading="lazy"
        referrerpolicy="no-referrer"
        onload="this.parentElement.classList.add('ok')"
        onerror="this.parentElement.style.display='none'">
      <div class="dac-cap">
        ${fleet.nosename?`<span class="dac-nose">✦ ${fleet.nosename}</span>`:''}
        ${fleet.colour?`<span class="dac-scheme">${fleet.colour}</span>`:''}
        ${fleet.modder?`<span class="dac-mod">Livery: ${fleet.modder}</span>`:''}
      </div>
    </div>`:'';
  document.getElementById('detContent').style.setProperty('--dc',p.color);
  document.getElementById('detContent').innerHTML=`
    <div class="dh">
      <div><div class="dfn">${p.flight}</div>${p.subsidiary?`<div style="font-family:var(--fm);font-size:9px;letter-spacing:.1em;color:var(--dim);margin-top:2px;">${p.subsidiary}</div>`:''}<div class="dpilot">✦ ${p.pilot}</div></div>
      <div class="dbadge">${p.network}</div>
    </div>
    <div class="drte">
      <div class="dap"><div class="dicao">${p.origin.icao}</div><div class="dtime">${p.dep}</div><div class="dname">${p.origin.name}</div>${oMeta?`<div class="dmeta">${oMeta}</div>`:''}</div>
      <div class="dline"><div class="dair">${p.airtime}</div><div class="ddiv"></div><div class="dair">${p.date}</div></div>
      <div class="dap"><div class="dicao">${p.dest.icao}</div><div class="dtime">${p.arr}</div><div class="dname">${p.dest.name}</div>${dMeta?`<div class="dmeta">${dMeta}</div>`:''}</div>
    </div>
    ${acBlock}
    <div class="dgrid">
      <div class="df"><div class="dfl">Aircraft</div><div class="dfv">${p.aircraft}</div></div>
      <div class="df"><div class="dfl">Registration</div><div class="dfv">${p.reg}</div></div>
      <div class="df"><div class="dfl">Simulator</div><div class="dfv">${p.sim}</div></div>
      <div class="df"><div class="dfl">Network</div><div class="dfv">${p.network}</div></div>
    </div>
    ${p.route?`<div class="dfpl"><div class="dfpl-lbl">✈ Filed Route${p._routePts?` · ${p._routePts.length-2} fixes plotted`:''}</div><div class="dfpl-txt">${p.route}</div></div>`:''}
    <div class="deval"><div class="devlbl">⚠ Self-Evaluation</div><div class="devtxt">"${p.eval}"</div></div>`;
  document.body.classList.remove('panel-collapsed');
  document.getElementById('panelToggle').textContent='◀';
  document.getElementById('flightList').style.display='none';
  document.getElementById('pagBar').style.display='none';
  document.getElementById('detailView').classList.add('vis');
  document.querySelectorAll('.pcard').forEach((c,j)=>c.classList.toggle('active',j===i));
  document.getElementById('apPopup').classList.remove('vis');
  if(globe){
    _savedAutoRot=autoRot; autoRot=0;
    selectedPIREP=p;
    const _va=ll2v(p.origin.lat,p.origin.lon),_vb=ll2v(p.dest.lat,p.dest.lon);
    const _mid=_va.clone().add(_vb).normalize();
    trgY=Math.atan2(-_mid.x,_mid.z);
    trgX=Math.asin(Math.max(-1,Math.min(1,_mid.y)));
  }
}

function closeDetail(){
  document.getElementById('detailView').classList.remove('vis');
  document.getElementById('flightList').style.display='flex';
  document.getElementById('pagBar').style.display=_filtered.length>PAGE_SIZE?'flex':'none';
  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('active'));
  autoRot=_savedAutoRot; selectedPIREP=null;
  flights.forEach(fl=>{if(fl.mat) fl.mat.opacity=fl.baseOpacity??0.85;});
}

// ═══════════════════════════════════════════════════════
// AIRPORT LABEL POPUP
// ═══════════════════════════════════════════════════════
function focusGlobe(lat,lon){
  if(!globe) return;
  const v=ll2v(lat,lon);
  trgY=Math.atan2(-v.x,v.z);
  trgX=-(lat*Math.PI/180)*0.46;
}
function handleLabelClick(icao,lblEl){
  const all=PIREPS.filter(p=>p.origin.icao===icao||p.dest.icao===icao);
  const matches=activeFilter?all.filter(p=>p.pilot.toLowerCase().includes(activeFilter.toLowerCase())):all;
  if(!matches.length) return;
  if(matches.length===1){openDetail(PIREPS.indexOf(matches[0]));return;}
  else{
    // Multiple flights — show popup near the label
    const rect=lblEl.getBoundingClientRect();
    const pop=document.getElementById('apPopup');
    const meta=airportMeta(icao);
    pop.innerHTML=`<div class="ap-pop-title">${icao} · ${matches.length} flights${meta?`<div style="font-family:var(--fm);font-size:8px;letter-spacing:.06em;color:var(--dim);margin-top:3px;text-transform:none;font-weight:400;">${meta}</div>`:''}</div>`+
      matches.map(p=>{
        const i=PIREPS.indexOf(p);
        return `<div class="ap-pop-item" onclick="openDetail(${i});document.getElementById('apPopup').classList.remove('vis')">
          <span class="ap-fi" style="color:${p.color}">${p.flight}</span>
          <span class="ap-fr">${p.origin.icao} → ${p.dest.icao}</span>
        </div>`;
      }).join('');
    let left=rect.left,top=rect.bottom+6;
    if(left+200>innerWidth) left=innerWidth-210;
    if(top+120>innerHeight) top=rect.top-130;
    pop.style.left=left+'px';pop.style.top=top+'px';
    pop.classList.add('vis');
  }
  // Always focus on the clicked airport itself (overrides openDetail's route midpoint)
  const ap=AIRPORT_COORDS[icao];
  if(ap) focusGlobe(ap.lat,ap.lon);
}

let _urlPilotApplied=false;
rebuildUI=function(){
  renderFlightList();
  renderBottomBar();
  updateStats();
  if(globe){ buildAirports(); buildFlights(); applyFlightVisibility(); }
  if(document.getElementById('opsOverlay').classList.contains('vis')) renderOps();

};

// ═══════════════════════════════════════════════════════
// OPERATIONS REPORT (monthly stats + fleet timeline)
// ═══════════════════════════════════════════════════════
let opsTab='month', opsMonthIdx=-1; // -1 = latest month with data

function pirepDate(p){
  if(p._rawTimestamp){const d=new Date(p._rawTimestamp);if(!isNaN(d))return d;}
  if(p.date){const d=new Date(p.date);if(!isNaN(d))return d;}
  return null;
}
function opsMonths(){
  const set=new Set();
  PIREPS.forEach(p=>{const d=pirepDate(p);if(d)set.add(d.getFullYear()*100+d.getMonth());});
  return [...set].sort((a,b)=>a-b);
}
function openOps(){
  document.getElementById('opsOverlay').classList.add('vis');
  renderOps();
}
function closeOps(){document.getElementById('opsOverlay').classList.remove('vis');}
function setOpsTab(t){
  opsTab=t;
  document.getElementById('opsTabM').classList.toggle('on',t==='month');
  document.getElementById('opsTabT').classList.toggle('on',t==='fleet');
  renderOps();
}
function opsNav(dir){
  const ms=opsMonths();
  if(!ms.length) return;
  let i=opsMonthIdx<0?ms.length-1:opsMonthIdx;
  opsMonthIdx=Math.max(0,Math.min(ms.length-1,i+dir));
  renderOps();
}
function renderOps(){
  if(opsTab==='month') renderMonthlyOps(); else renderFleetTimeline();
}

function renderMonthlyOps(){
  const body=document.getElementById('opsBody');
  const ms=opsMonths();
  if(!ms.length){body.innerHTML='<div class="no-flights">No dated flights available.</div>';return;}
  const idx=opsMonthIdx<0?ms.length-1:Math.min(opsMonthIdx,ms.length-1);
  const key=ms[idx], year=Math.floor(key/100), mon=key%100;
  const set=PIREPS.filter(p=>{const d=pirepDate(p);return d&&d.getFullYear()===year&&d.getMonth()===mon;});
  const totalMins=set.reduce((s,p)=>s+airtimeToMinutes(p.airtime),0);

  // Weekly buckets (days 1–7, 8–14, 15–21, 22–28, 29+)
  const weeks=[0,0,0,0,0], wMins=[0,0,0,0,0];
  set.forEach(p=>{
    const w=Math.min(4,Math.floor((pirepDate(p).getDate()-1)/7));
    weeks[w]++; wMins[w]+=airtimeToMinutes(p.airtime);
  });
  while(weeks.length>4&&!weeks[weeks.length-1]){weeks.pop();wMins.pop();}
  const maxW=Math.max(1,...weeks);

  const byPilot={};
  set.forEach(p=>{(byPilot[p.pilot]=byPilot[p.pilot]||{n:0,m:0});byPilot[p.pilot].n++;byPilot[p.pilot].m+=airtimeToMinutes(p.airtime);});
  const topPilot=Object.entries(byPilot).sort((a,b)=>b[1].n-a[1].n||b[1].m-a[1].m)[0];

  const byRoute={};
  set.forEach(p=>{const k=p.origin.icao+' → '+p.dest.icao;byRoute[k]=(byRoute[k]||0)+1;});
  const topRoute=Object.entries(byRoute).sort((a,b)=>b[1]-a[1])[0];

  const byAc={};
  set.forEach(p=>{
    const k=p.reg||p.aircraft||'N/A';
    (byAc[k]=byAc[k]||{m:0,n:0,type:p.aircraft});
    byAc[k].m+=airtimeToMinutes(p.airtime); byAc[k].n++;
  });
  const topAc=Object.entries(byAc).sort((a,b)=>b[1].m-a[1].m||b[1].n-a[1].n)[0];

  const MN=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  body.innerHTML=`
    <div class="ops-mnav">
      <button class="pag-btn" onclick="opsNav(-1)" ${idx===0?'disabled':''}>◀</button>
      <span class="ops-month">${MN[mon]} ${year}</span>
      <button class="pag-btn" onclick="opsNav(1)" ${idx===ms.length-1?'disabled':''}>▶</button>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-l">Flights</div><div class="kpi-v">${set.length}</div><div class="kpi-s">logged this month</div></div>
      <div class="kpi"><div class="kpi-l">Flying Hours</div><div class="kpi-v">${minutesToHM(totalMins)}</div><div class="kpi-s">total block time</div></div>
      <div class="kpi"><div class="kpi-l">Most Active Pilot</div><div class="kpi-v" style="font-size:12px">${topPilot?topPilot[0]:'–'}</div><div class="kpi-s">${topPilot?topPilot[1].n+' flights · '+minutesToHM(topPilot[1].m):''}</div></div>
      <div class="kpi"><div class="kpi-l">Busiest Route</div><div class="kpi-v" style="font-size:12px">${topRoute?topRoute[0]:'–'}</div><div class="kpi-s">${topRoute?topRoute[1]+' flight'+(topRoute[1]>1?'s':''):''}</div></div>
      <div class="kpi"><div class="kpi-l">Most Utilized Aircraft</div><div class="kpi-v" style="font-size:12px">${topAc?topAc[0]:'–'}</div><div class="kpi-s">${topAc?(topAc[1].type&&topAc[1].type!==topAc[0]?topAc[1].type+' · ':'')+minutesToHM(topAc[1].m)+' · '+topAc[1].n+' flight'+(topAc[1].n>1?'s':''):''}</div></div>
    </div>
    <div class="ops-sec">Flights per week</div>
    <div class="wk-chart">${weeks.map(n=>`<div class="wk-col"><span class="wk-n">${n||''}</span><div class="wk-bar" style="height:${n/maxW*100}%"></div></div>`).join('')}</div>
    <div class="wk-lbl">${weeks.map((n,i)=>`<span class="wk-l">W${i+1}<br>${minutesToHM(wMins[i])}</span>`).join('')}</div>`;
}

function renderFleetTimeline(){
  const body=document.getElementById('opsBody');
  const dated=PIREPS.filter(p=>pirepDate(p));
  if(!dated.length){body.innerHTML='<div class="no-flights">No dated flights available.</div>';return;}
  const times=dated.map(p=>pirepDate(p).getTime());
  const min=Math.min(...times), max=Math.max(...times), span=Math.max(1,max-min);
  const maxAir=Math.max(1,...dated.map(p=>airtimeToMinutes(p.airtime)));
  const byReg={};
  dated.forEach(p=>{
    const k=p.reg||'—';
    (byReg[k]=byReg[k]||{mins:0,list:[],types:new Set()});
    byReg[k].mins+=airtimeToMinutes(p.airtime);
    byReg[k].list.push(p);
    if(p.aircraft) byReg[k].types.add(p.aircraft);
  });
  const rows=Object.entries(byReg).sort((a,b)=>b[1].mins-a[1].mins);
  const fmtD=t=>new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}).toUpperCase();
  body.innerHTML=`
    <div class="tl-axis"><span>${fmtD(min)}</span><span>AIRCRAFT UTILIZATION · ${rows.length} AIRFRAME${rows.length>1?'S':''}</span><span>${fmtD(max)}</span></div>
    <div class="tl-grid">`
    +rows.map(([reg,r])=>{
      const dots=r.list.map(p=>{
        const left=3+(pirepDate(p).getTime()-min)/span*94;
        const sz=6+Math.round(airtimeToMinutes(p.airtime)/maxAir*8);
        const i=PIREPS.indexOf(p);
        return `<div class="tl-dot" style="left:${left.toFixed(2)}%;width:${sz}px;height:${sz}px;background:${p.color};color:${p.color}"
          title="${p.flight} · ${p.origin.icao}→${p.dest.icao} · ${p.date} · ${p.airtime}"
          onclick="closeOps();openDetail(${i})"></div>`;
      }).join('');
      const fleet=fleetFor(reg);
      const img=fleet&&fleet.image
        ?`<div class="tl-img-wrap"><img class="tl-img" src="${driveThumb(fleet.image,600)||fleet.image}" alt="${reg}" loading="lazy" referrerpolicy="no-referrer" onload="this.parentElement.classList.add('ok')" onerror="this.parentElement.outerHTML='<div class=\\'tl-noimg\\'>NO IMAGE</div>'"></div>`
        :`<div class="tl-noimg">NO IMAGE</div>`;
      const sub=`${fleet&&fleet.nosename?`<span class="tl-nose">✦ ${fleet.nosename}</span> · `:''}${[...r.types].join(' / ')||'—'}`;
      return `<div class="tl-card">
        ${img}
        <div class="tl-body">
          <div class="tl-head">
            <span class="tl-reg">${reg}</span>
            <span class="tl-hours">${minutesToHM(r.mins)} <span>· ${r.list.length} FLT${r.list.length>1?'S':''}</span></span>
          </div>
          <div class="tl-sub">${sub}</div>
          <div class="tl-track">${dots}</div>
        </div>
      </div>`;
    }).join('')
    +`</div>`;
}

document.getElementById('opsOverlay').addEventListener('click',e=>{if(e.target.id==='opsOverlay')closeOps();});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeOps();});

function toggleDebug(){
  const p=document.getElementById('dbgPanel');

function refreshDebug(){
  const ago = _dbgLastFetch
    ? Math.round((Date.now()-new Date(_dbgLastFetch))/1000)+'s ago'
    : 'never';
  const keyHtml = _dbgRawKeys.length
    ? _dbgRawKeys.map(k=>`<span>${k}</span>`).join('')

  document.getElementById('dbgContent').innerHTML=`
    <div class="dbg-row"><span class="dbg-lbl">Airport DB</span>
      <span class="dbg-val ${_dbgAirports>0?'dbg-ok':'dbg-err'}">${_dbgAirports>0?_dbgAirports+' airports':'FAILED'}</span></div>
    <div class="dbg-row"><span class="dbg-lbl">Fleet DB</span>
      <span class="dbg-val ${_dbgFleet>0?'dbg-ok':'dbg-err'}">${_dbgFleet>0?_dbgFleet+' airframes':'FAILED'}</span></div>
    <div class="dbg-row"><span class="dbg-lbl">PIREP source</span>
      <span class="dbg-val ${_dbgFallback?'dbg-err':'dbg-ok'}">${_dbgFallback?'FALLBACK ('+FALLBACK_PIREPS.length+')':'LIVE ('+_dbgPireps+')'}</span></div>
    <div class="dbg-row"><span class="dbg-lbl">Filed routes</span>
      <span class="dbg-val ${_airacDead?'dbg-err':(_dbgRoutesResolved>0?'dbg-ok':'')}">${_airacDead?'API UNREACHABLE (CORS?)':(_dbgRoutesTotal?_dbgRoutesResolved+' / '+_dbgRoutesTotal+' resolved':'no route field')}</span></div>
    <div class="dbg-row"><span class="dbg-lbl">Last fetch</span>
      <span class="dbg-val">${ago}</span></div>
    ${_dbgErr?`<div class="dbg-row"><span class="dbg-lbl">Error</span><span class="dbg-val dbg-err" style="font-size:8px">${_dbgErr}</span></div>`:''}
    <div class="dbg-keys"><span class="dbg-lbl" style="display:block;margin-bottom:4px">Sheet column keys:</span>${keyHtml}</div>`;
}
async function forceRefresh(){
  document.getElementById('dbgRefresh').textContent='FETCHING…';
  lastFetched=0;
  await Promise.allSettled([fetchPIREPs(),fetchFleetDB()]);
  rebuildUI();
  refreshDebug();
  document.getElementById('dbgRefresh').textContent='⟳ FORCE REFRESH NOW';
}
